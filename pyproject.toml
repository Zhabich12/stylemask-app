[project]
name = "stylemask"
version = "0.1.0"
description = "Local-first authorship obfuscation: rewrite text so stylometry can't link it to you"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "httpx>=0.27",
    "zstandard>=0.22",
    "pymorphy3>=2.0",
    "joblib>=1.3",
]

[project.scripts]
stylemask = "stylemask.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
